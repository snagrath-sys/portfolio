<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section class="timeline">
        <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
                <span class="year">2025</span> - <span class="company">Microsoft (Software Engineer IC3)</span>
            </div>
        </div>

        <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
                <span class="year">2024</span> - <span class="company">USC Keck School of Medicine (ML Engineer)</span>
            </div>
        </div>

        <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
                <span class="year">2023</span> - <span class="company">USC ISI (ML Engineer)</span>
            </div>
        </div>

        <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
                <span class="year">2022</span> - <span class="company">Juniper Networks (Software Engineer 2)</span>
            </div>
        </div>

        <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
                <span class="year">2021</span> - <span class="company">Oracle (Software Engineer 1)</span>
            </div>
        </div>

    </section>

    <script src="script.js"></script>
</body>
</html>
